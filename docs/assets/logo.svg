<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="mw-logo-title">
  <title id="mw-logo-title">felinar: a horseshoe magnet holding a globe</title>
  <defs>
    <linearGradient id="mw-logo-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b52f0"/>
      <stop offset="1" stop-color="#3a2fbf"/>
    </linearGradient>
  </defs>
  <!-- The tile carries the colour; the glyph is one flat colour, so the mark also works as a
       single-colour stamp (draw the glyph alone, in any ink, without the tile). -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#mw-logo-tile)"/>
  <g fill="none" stroke="#ffffff">
    <!-- the magnet: two arms joined by a half circle; the pole tips are separate blocks -->
    <path d="M34 46 V70 A30 30 0 0 0 94 70 V46" stroke-width="16"/>
    <!-- the globe the magnet holds -->
    <circle cx="64" cy="67" r="15" stroke-width="4.5"/>
    <ellipse cx="64" cy="67" rx="6.5" ry="15" stroke-width="3.5"/>
    <path d="M49 67 H79" stroke-width="3.5"/>
  </g>
  <g fill="#ffffff">
    <rect x="26" y="24" width="16" height="16" rx="2"/>
    <rect x="86" y="24" width="16" height="16" rx="2"/>
  </g>
</svg>
