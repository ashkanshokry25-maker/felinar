groups:
  - name: magnet-tracker
    rules:
      - alert: TrackerDown
        expr: up{job="mwt"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "tracker.mjs metrics endpoint is not answering" }
      - alert: TrackerRestartLoop
        expr: changes(mwt_process_start_time_seconds[30m]) > 3
        labels: { severity: page }
        annotations: { summary: "tracker restarted more than 3 times in 30 minutes" }
      - alert: TrackerUncaughtException
        expr: increase(mwt_uncaught_exceptions_total[15m]) > 0
        labels: { severity: warn }
        annotations: { summary: "uncaught exception (a message shape the validator let through); see journalctl -u magnet-tracker" }
      - alert: TrackerNoClients
        expr: mwt_connections == 0
        for: 30m
        labels: { severity: warn }
        annotations: { summary: "no WebSocket clients for 30 min (DNS, TLS, firewall or Caddy problem, or simply no visitors)" }
      - alert: TrackerNearConnectionCap
        expr: mwt_connections > 0.8 * 20000
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "over 80% of MAX_CONNECTIONS in use" }
      - alert: TrackerEventLoopLag
        expr: mwt_event_loop_lag_p99_seconds > 0.1
        for: 5m
        labels: { severity: warn }
        annotations: { summary: "p99 event-loop delay above 100 ms: single core saturated, add a second tracker or move to aquatic_ws" }
      - alert: TrackerMemoryHigh
        expr: mwt_process_resident_memory_bytes > 1.2e9
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "RSS above 1.2 GB (MemoryHigh in the unit)" }
      - alert: TrackerRejectSpike
        expr: sum(rate(mwt_messages_rejected_total[5m])) > 5
        for: 10m
        labels: { severity: info }
        annotations: { summary: "sustained rejected messages: a buggy client or an attacker; see the reason label" }
      - alert: TrackerRefusalSpike
        expr: sum(rate(mwt_upgrades_refused_total[5m])) > 5
        for: 10m
        labels: { severity: info }
        annotations: { summary: "sustained refused upgrades (ip_connections, ip_rate, origin, full): check the reason label" }
      - alert: TrackerWebSocketProbeFailing
        # needs the external probe (probes/soak.py or blackbox_exporter) to push/export this metric
        expr: probe_success{job="ws-probe"} == 0
        for: 5m
        labels: { severity: page }
        annotations: { summary: "external WebSocket announce probe failing for 5 min" }
      - alert: CertificateExpiresSoon
        expr: probe_ssl_earliest_cert_expiry{job="ws-probe"} - time() < 7 * 86400
        labels: { severity: page }
        annotations: { summary: "TLS certificate expires in under 7 days (Caddy renewal is failing)" }
