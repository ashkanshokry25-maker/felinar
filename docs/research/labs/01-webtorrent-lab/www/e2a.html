<!doctype html>
<meta charset="utf-8">
<title>E2a first tab: requests answered while another tab also runs a WebTorrent server</title>
<body>
<pre id="log"></pre>
<script type="module">
import WebTorrent from './webtorrent.min.js'
const R = { errors: [] }
const sleep = ms => new Promise(r => setTimeout(r, ms))
const report = async () => { try { await fetch('/report/e2', { method: 'POST', body: JSON.stringify(R, null, 2) }) } catch (e) {} }
try {
  const reg = await navigator.serviceWorker.register('./sw.min.js', { scope: './' })
  await navigator.serviceWorker.ready
  const client = new WebTorrent({ tracker: false, lsd: false, dht: false, utPex: false })
  client.createServer({ controller: reg })
  const f = new File(['<h1>hi</h1>'], 'a.html', { type: 'text/html' }); Object.defineProperty(f, 'fullPath', { value: 'one/a.html' })
  const g = new File(['x'], 'b.txt', { type: 'text/plain' }); Object.defineProperty(g, 'fullPath', { value: 'one/b.txt' })
  const t = await new Promise((res, rej) => { const tt = client.seed([f, g], { announce: [], name: 'one' }, res); tt.on('error', rej) })
  const url = t.files[0].streamURL
  // baseline: only this tab has a server
  R.baseline = { ok: 0, notOk: 0, statuses: {} }
  for (let i = 0; i < 40; i++) { const r = await fetch(url, { cache: 'no-store' }); R.baseline.statuses[r.status] = (R.baseline.statuses[r.status] || 0) + 1; await r.text() }
  // open tab B as a popup (separate top-level browsing context, same origin/profile)
  R.popupOpened = !!window.open('/e2b.html')
  // wait for tab B
  for (let i = 0; i < 100; i++) { const r = await fetch('/kv/b-ready'); if (r.status === 200) break; await sleep(100) }
  await sleep(500)
  R.withSecondTab = { statuses: {}, bodies404: 0 }
  for (let i = 0; i < 120; i++) { const r = await fetch(url, { cache: 'no-store' }); R.withSecondTab.statuses[r.status] = (R.withSecondTab.statuses[r.status] || 0) + 1; const txt = await r.text(); if (r.status === 404 && /404/.test(txt)) R.withSecondTab.bodies404++ }
} catch (e) { R.fatal = String(e && e.stack || e) }
document.getElementById('log').textContent = JSON.stringify(R, null, 2)
await report()
</script>
