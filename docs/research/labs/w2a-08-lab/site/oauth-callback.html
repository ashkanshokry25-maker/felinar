<!doctype html><html lang="en"><head><meta charset="utf-8"><title>OAuth callback</title></head><body><h1>callback</h1><script>
var r = { opener: !!window.opener, parentOpener: (function () { try { return !!window.parent.opener } catch (e) { return 'err' } })(), isTop: window.top === window }
