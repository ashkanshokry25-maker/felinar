<!doctype html><meta charset="utf-8"><title>site</title><body><pre id="out">running</pre>
<script type="module">
const out = (o) => { document.getElementById('out').textContent = JSON.stringify(o); window.__result = o; };
const b64u = (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const utf8 = (s) => new TextEncoder().encode(s);
const r = { origin: location.origin, isSecure: isSecureContext, inIframe: window !== window.top, step: {} };
try {
  r.hasPKC = typeof PublicKeyCredential !== 'undefined';
  if (PublicKeyCredential.getClientCapabilities) {
    try { const c = await PublicKeyCredential.getClientCapabilities(); r.clientCapabilities = c; } catch (e) { r.clientCapabilitiesErr = String(e); }
  }
  const rpId = location.hostname;
  const challenge0 = crypto.getRandomValues(new Uint8Array(32));
  const cred = await navigator.credentials.create({ publicKey: {
    rp: { id: rpId, name: 'mw test' }, user: { id: utf8('user1'), name: 'u1', displayName: 'U1' },
    challenge: challenge0, pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
    authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
    extensions: { prf: {} } } });
  r.step.create = { id: b64u(new Uint8Array(cred.rawId)).slice(0, 12) + '...', ext: cred.getClientExtensionResults() };
  const spki = new Uint8Array(cred.response.getPublicKey());
  const credId = new Uint8Array(cred.rawId);
  // PRF evaluations
  const siteSalt = async (id) => new Uint8Array(await crypto.subtle.digest('SHA-256', utf8('mw/site/' + id)));
  const getPrf = async (saltBytes) => {
    const a = await navigator.credentials.get({ publicKey: { rpId, challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: credId }], userVerification: 'required', extensions: { prf: { eval: { first: saltBytes } } } } });
    const x = a.getClientExtensionResults();
    return x.prf && x.prf.results && x.prf.results.first ? new Uint8Array(x.prf.results.first) : null;
  };
  const saltA = await siteSalt('siteA');
  const saltB = await siteSalt('siteB');
  const p1 = await getPrf(saltA), p2 = await getPrf(saltA), p3 = await getPrf(saltB);
  r.step.prf = { len: p1 && p1.length, deterministic: !!p1 && b64u(p1) === b64u(p2), perSiteDiffers: !!p1 && !!p3 && b64u(p1) !== b64u(p3) };
  // HKDF -> Ed25519 seed -> PKCS8 import -> sign/verify, and P-256 via HKDF -> JWK is not possible without public point derivation; test Ed25519
  const hk = await crypto.subtle.importKey('raw', p1, 'HKDF', false, ['deriveBits']);
  const seed = new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: utf8('mw/identity/v1/ed25519') }, hk, 256));
  const pkcs8 = new Uint8Array([0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x04,0x22,0x04,0x20, ...seed]);
  try {
    const sk = await crypto.subtle.importKey('pkcs8', pkcs8, { name: 'Ed25519' }, true, ['sign']);
    const jwk = await crypto.subtle.exportKey('jwk', sk);
    const pk = await crypto.subtle.importKey('jwk', { kty: 'OKP', crv: 'Ed25519', x: jwk.x }, { name: 'Ed25519' }, true, ['verify']);
    const msg = utf8('block-hash-bytes');
    const sig = new Uint8Array(await crypto.subtle.sign({ name: 'Ed25519' }, sk, msg));
    const ok = await crypto.subtle.verify({ name: 'Ed25519' }, pk, sig, msg);
    // second derivation yields same public key?
    const hk2 = await crypto.subtle.importKey('raw', p2, 'HKDF', false, ['deriveBits']);
    const seed2 = new Uint8Array(await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: utf8('mw/identity/v1/ed25519') }, hk2, 256));
    const sk2 = await crypto.subtle.importKey('pkcs8', new Uint8Array([0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x70,0x04,0x22,0x04,0x20, ...seed2]), { name: 'Ed25519' }, true, ['sign']);
    const jwk2 = await crypto.subtle.exportKey('jwk', sk2);
    r.step.ed25519 = { supported: true, signVerifyOk: ok, samePubKeyOnRederive: jwk.x === jwk2.x, pub: jwk.x };
  } catch (e) { r.step.ed25519 = { supported: false, err: String(e) }; }
  // WebAuthn assertion as block signature: challenge = sha256(canonical entry)
  const blockHash = new Uint8Array(await crypto.subtle.digest('SHA-256', utf8('{"v":1,"op":"append"}')));
  const asr = await navigator.credentials.get({ publicKey: { rpId, challenge: blockHash, allowCredentials: [{ type: 'public-key', id: credId }], userVerification: 'required' } });
  const authData = new Uint8Array(asr.response.authenticatorData);
  const cdj = new Uint8Array(asr.response.clientDataJSON);
  const derSig = new Uint8Array(asr.response.signature);
  const cd = JSON.parse(new TextDecoder().decode(cdj));
  // DER -> raw r||s
  const derToRaw = (der) => { let o = 2; if (der[1] & 0x80) o += (der[1] & 0x7f); const rl = der[o + 1]; let rr = der.slice(o + 2, o + 2 + rl); o = o + 2 + rl; const sl = der[o + 1]; let ss = der.slice(o + 2, o + 2 + sl); const fix = (x) => { while (x.length > 32 && x[0] === 0) x = x.slice(1); const p = new Uint8Array(32); p.set(x, 32 - x.length); return p; }; return new Uint8Array([...fix(rr), ...fix(ss)]); };
  const raw = derToRaw(derSig);
  const cdjHash = new Uint8Array(await crypto.subtle.digest('SHA-256', cdj));
  const signed = new Uint8Array([...authData, ...cdjHash]);
  const pubKey = await crypto.subtle.importKey('spki', spki, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const verified = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pubKey, raw, signed);
  r.step.webauthnSig = { verified, challengeMatches: cd.challenge === b64u(blockHash), origin: cd.origin, type: cd.type, authDataLen: authData.length, cdjLen: cdj.length, derSigLen: derSig.length, rawSigLen: raw.length, extraBytesVsRawSig: authData.length + cdj.length + derSig.length - 64, extraB64urCharsApprox: Math.ceil((authData.length + cdj.length + derSig.length - 64) * 4 / 3) };
} catch (e) { r.error = e.name + ': ' + e.message; }
out(r);
</script>
