# .github/workflows/release.yml: pushing a tag v<version> builds, tests and packs that commit, attests where the files came from, and
# leaves a DRAFT release for the owner to sign and publish (V03-DESIGN-REVIEW 2.19, SC-1, SC-2, SC-3, SC-8, MF-78).
#
#   build    checks that the tag matches package.json; npm ci --ignore-scripts; npm test; the parser fuzzers with a short
#            budget; the strict build (every optional entry must build) with its lock check; the identity page build
#            (npm run build:idp); the end-to-end suite (Chromium and WebKit, 127.0.0.1 only); then packs, from the tagged
#            commit and with fixed times:
#              felinar-<version>-dist.zip   the built loader under dist/: the files a host serves
#              felinar-<version>-idp.zip    the identity page under dist-idp/ (its hash is printed on its cards)
#              felinar-<version>.tgz        the npm package (npm pack): bin, src, tools, the build and npm-shrinkwrap.json
#              hashes-dist.json, hashes-idp.json   the per-file SHA-256 lists of the two trees (tools/verify-release.mjs list)
#              SHA256SUMS                      their SHA-256, for `sha256sum -c SHA256SUMS`
#            and takes the release notes from the "## [<version>]" section of CHANGELOG.md.
#   attest   (environment "release") a build provenance attestation for those files (actions/attest-build-provenance:
#            gh attestation verify <file> --repo <owner>/<repository>). It runs no repository code and no npm.
#   release  (environment "release") creates a DRAFT GitHub Release with those files and notes. It runs no repository code,
#            is the only job that can write (contents: write), and never replaces anything: if a release for the tag
#            exists it stops. It does not publish.
#
# Publishing is the owner's step, offline, because the signing key never enters CI:
#   1. gh release download <tag> --pattern 'hashes-*.json' --pattern 'felinar-*.zip'
#   2. rebuild the same commit and compare (node build.mjs --strict; node tools/verify-release.mjs list dist ...), or read the
#      cross-OS reproducibility run (.github/workflows/rebuild.yml)
#   3. node tools/verify-release.mjs sign --list hashes-dist.json --rebuilt <your build of the tag>/dist --key <release key file> --out hashes-dist.json.sig  (and hashes-idp.json)
#   4. gh release upload <tag> hashes-dist.json.sig hashes-idp.json.sig   (no --clobber: the draft has none of them yet)
#   5. node tools/verify-release.mjs verify <unzipped dist> --list hashes-dist.json --sig hashes-dist.json.sig --pubkey <pinned key> --expect-version <v> --expect-tree dist
#   6. gh release edit <tag> --draft=false   (the release becomes immutable: no file and no tag can change afterwards)
# The release key's public half is pinned in README.md, SECURITY.md and PINNED_RELEASE_KEYS (tools/verify-release.mjs), with the
# second places SECURITY.md names (the tag message, release-key.txt and its OpenPGP signature, an archive copy; no domain).
#
# Repository settings this workflow assumes (the owner sets them once; a workflow cannot):
#   - Settings, General, Releases: "Enable release immutability" (published releases keep their files and their tag).
#   - Settings, Rules, Rulesets, a tag ruleset on "v*": restrict deletions and restrict updates (no force push, no move), as
#     docs/PUBLISH-CHECKLIST.md step 9b sets it. A published tag then cannot be deleted or repointed at other code.
#   - Settings, Environments, "release": required reviewers and a deployment rule that allows only the tags "v*"; the attest and
#     release jobs wait for that approval. With two maintainers the reviewer is the one who did not push the tag; with one, the
#     owner approves their own run and the release notes say so (docs/PUBLISH-CHECKLIST.md step 9b and section 14).
#   - Settings, Code security: Dependabot with a 14-day cooldown for version updates (security updates are not delayed), and a
#     CODEOWNERS rule so that a change to build.lock.json, package-lock.json, npm-shrinkwrap.json or .github/ needs a second person.
#
# Before tagging, work through docs/PUBLISH-CHECKLIST.md. This workflow refuses a tag whose version differs from package.json, and
# one whose version has no "## [<version>] - <date>" heading in CHANGELOG.md (rename "## [Unreleased] - <version>" first).
# Nothing here publishes to npm.

name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache for a release build: everything comes from the registry, checked against
          # the lockfile's integrity hashes.
          package-manager-cache: false
      - name: The tag names the version in package.json
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but package.json says $version: tag v$version, or set the version first (CONTRIBUTING.md, Release process)"
            exit 1
          fi
          prerelease="$(node -p "/^0\.|-/.test(process.argv[1])" "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      # Relative links in the changelog would not resolve on the release page: they point at the tagged tree.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const esc = v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const start = lines.findIndex((l) => new RegExp("^## \\[" + esc + "\\]").test(l));
            if (start < 0) {
              console.log("::error::CHANGELOG.md has no \"## [" + v + "] - <date>\" section: rename \"## [Unreleased] - " + v + "\" before tagging (docs/PUBLISH-CHECKLIST.md)");
              process.exit(1);
            }
            let end = lines.findIndex((l, i) => i > start && /^## /.test(l));
            if (end < 0) end = lines.length;
            const tree = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/blob/" + process.env.GITHUB_REF_NAME + "/";
            const body = lines.slice(start + 1, end).filter((l) => !/^\[[^\]]+\]: \S+$/.test(l)).join("\n").trim()
              .replace(/\]\((?![a-z][a-z0-9+.-]*:|#)([^)\s]+)\)/gi, (m, p) => "](" + tree + p.replace(/^\.?\//, "") + ")");
            const files = "\n\n### Files\n\n" +
              "- `felinar-" + v + "-dist.zip`: the built loader under `dist/`, the files a host serves ([docs/DEPLOY.md](" + tree + "docs/DEPLOY.md)).\n" +
              "- `felinar-" + v + "-idp.zip`: the identity page under `dist-idp/`; `hashes-idp.json` names every file and the signature `hashes-idp.json.sig` is checked with the pinned release key.\n" +
              "- `felinar-" + v + ".tgz`: the package with the `felinar` command (`npm install -g ./felinar-" + v + ".tgz`).\n" +
              "- `hashes-dist.json`, `hashes-idp.json` and their `.sig` files: the signed per-file SHA-256 lists (`node tools/verify-release.mjs verify`, offline).\n" +
              "- `SHA256SUMS`: check the downloads with `sha256sum -c SHA256SUMS`.\n" +
              "- `release-key.txt` and `release-key.txt.asc`: the release key and its OpenPGP signature, added by the owner after this job; compare the key with SECURITY.md.\n" +
              "- Build provenance: `gh attestation verify <file> --repo " + process.env.GITHUB_REPOSITORY + "`.\n";
            fs.writeFileSync("release/notes.md", body + files);
          '
          cat release/notes.md
      - name: Install from the lockfile, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The npm package pins what the lockfile pins
        run: |
          set -euo pipefail
          # npm-shrinkwrap.json goes into the published tarball; it must be the lockfile, byte for byte.
          cmp package-lock.json npm-shrinkwrap.json
      - name: Lint and unit tests
        run: npm test
      - name: Fuzz the parsers (short budget)
        run: npm run test:fuzz -- --iterations 5000 --seconds 120 --seed "$GITHUB_RUN_NUMBER"
      - name: Build the loader and the identity page, strict, and check the lock
        run: |
          set -euo pipefail
          node build.mjs --strict
          node build.mjs --check-lock
          npm run build:idp
      # The media and files rows of the end-to-end suite build their MP4 fixtures with ffmpeg (test/e2e/scenarios-v03.mjs); the
      # runner image does not put it on PATH. Without it the v0.3.0 release run failed at End-to-end before packaging (run 40504731089).
      - name: Install ffmpeg for the media fixtures
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end
        run: npm run test:e2e
      - name: Package the loader, the identity page and the npm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Same commit, same bytes: file times set to the commit time, a sorted file list, UTC times
          # and no extra attributes in the zip.
          epoch="$(git log -1 --format=%ct)"
          find dist dist-idp -exec touch -h -d "@$epoch" {} +
          find dist -type f | LC_ALL=C sort | TZ=UTC zip -X -D -q "release/felinar-$VERSION-dist.zip" -@
          find dist-idp -type f | LC_ALL=C sort | TZ=UTC zip -X -D -q "release/felinar-$VERSION-idp.zip" -@
          npm pack --ignore-scripts --pack-destination release
          tar -tzf "release/felinar-$VERSION.tgz" | grep -qx 'package/npm-shrinkwrap.json'
          # The per-file lists the owner signs offline (tools/verify-release.mjs sign) and everyone verifies (verify).
          node tools/verify-release.mjs list dist --out release/hashes-dist.json --tree dist --version "$VERSION"
          node tools/verify-release.mjs list dist-idp --out release/hashes-idp.json --tree dist-idp --version "$VERSION"
          cd release
          sha256sum "felinar-$VERSION-dist.zip" "felinar-$VERSION-idp.zip" "felinar-$VERSION.tgz" hashes-dist.json hashes-idp.json > SHA256SUMS
          cat SHA256SUMS
          {
            echo "### felinar $VERSION"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: The files are the ones the build job listed
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
      # Pinned offline: check this hash against the tag in its comment (docs/PUBLISH-CHECKLIST.md, section 6) before the first release.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            release/felinar-*.zip
            release/felinar-*.tgz
            release/hashes-*.json

  release:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the DRAFT release (never replace a release that exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          # Releases are immutable once published, and a draft is not replaced either: there is no --clobber anywhere.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a release for $TAG already exists. Nothing is replaced: tag a new version instead (docs/PUBLISH-CHECKLIST.md)."
            exit 1
          fi
          files=("felinar-$VERSION-dist.zip" "felinar-$VERSION-idp.zip" "felinar-$VERSION.tgz" hashes-dist.json hashes-idp.json SHA256SUMS)
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "felinar $VERSION" --notes-file notes.md ${flags[@]+"${flags[@]}"}
          {
            echo "### Draft release $TAG created"
            echo
            echo "Next, offline: sign hashes-dist.json and hashes-idp.json with the release key, upload the .sig files, verify, then publish the draft. The steps are at the top of .github/workflows/release.yml."
          } >> "$GITHUB_STEP_SUMMARY"
