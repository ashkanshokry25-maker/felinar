# .github/workflows/rebuild.yml: the build is reproducible across operating systems (V03-DESIGN-REVIEW 2.19, SC-1, SC-8, MF-78).
#
#   build    (Linux, macOS, Windows) npm ci --ignore-scripts, the strict build of the loader (dist/) and of the identity page
#            (npm run build:idp, dist-idp/), then the per-file SHA-256 list of each tree (tools/verify-release.mjs list).
#   compare  downloads the three lists and fails unless they are byte for byte the same. A difference is a file that depends on the
#            machine that built it (a path, a line ending, a time, a platform binary); it names the first differing file.
#
# This is the check behind "the release you download is the release the source builds": a second person on another machine gets the
# same hashes (docs/PUBLISH-CHECKLIST.md). It runs on every pull request that touches the build, on main, weekly, and by hand.
#
# Security baseline (docs/DEPLOY.md, CI/CD): no permissions at the workflow level and read-only contents per job, no secrets, every
# action pinned to a full commit SHA, checkout without persisted credentials, install scripts off.

name: rebuild

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'build.mjs'
      - 'build.lock.json'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'src/**'
      - 'tools/build-idp.mjs'
      - 'tools/verify-release.mjs'
      - '.github/workflows/rebuild.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rebuild-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install from the lockfile, without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the loader and the identity page
        run: |
          set -euo pipefail
          node build.mjs --strict
          npm run build:idp
      - name: List every file with its SHA-256
        run: |
          set -euo pipefail
          mkdir -p hashes
          version="$(node -p "require('./package.json').version")"
          node tools/verify-release.mjs list dist --out hashes/hashes-dist.json --tree dist --version "$version"
          node tools/verify-release.mjs list dist-idp --out hashes/hashes-idp.json --tree dist-idp --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.os }}
          path: hashes/
          if-no-files-found: error
          retention-days: 14

  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hashes-ubuntu-latest
          path: hashes/ubuntu-latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hashes-macos-latest
          path: hashes/macos-latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hashes-windows-latest
          path: hashes/windows-latest
      - name: The three builds are the same bytes
        run: |
          set -euo pipefail
          status=0
          for tree in dist idp; do
            for other in macos-latest windows-latest; do
              if ! cmp -s "hashes/ubuntu-latest/hashes-$tree.json" "hashes/$other/hashes-$tree.json"; then
                echo "::error::the $tree tree differs between ubuntu-latest and $other"
                diff "hashes/ubuntu-latest/hashes-$tree.json" "hashes/$other/hashes-$tree.json" | head -20 || true
                status=1
              fi
            done
          done
          for tree in dist idp; do
            echo "$tree: $(sha256sum "hashes/ubuntu-latest/hashes-$tree.json" | cut -d' ' -f1) ($(grep -c '"sha256"' "hashes/ubuntu-latest/hashes-$tree.json") files)" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
