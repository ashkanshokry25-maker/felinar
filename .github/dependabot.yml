version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    # Version updates wait 14 days after a release (chosen, V03-DESIGN-REVIEW 2.19); security updates are not delayed.
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 5
    groups:
      dev-tooling: { patterns: ["esbuild", "playwright", "http-server"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directory: "/deploy/pin"
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
