# deploy/one-box/docker-compose.yml: one rented server, one site, no domain (docs/research/v03/S2-zero-setup-hosting.md, rung 2a;
# docs/research/v03/SEEDING-AND-ZERO-SETUP-DESIGN.md 3.2). It is deploy/tracker/docker-compose.yml with these changes:
#   1. caddy serves the site. ./site is mounted read-only at /srv/site, and the site address is LW_SITE, a name such as 203-0-113-7.nip.io.
#      LW_ACME_CA picks the Let's Encrypt directory (staging first, then production). `npx felinar ship` writes both into .env.
#   2. the Caddyfile is this directory's own: the static site, the tracker on /tracker, the headers (see the comments in it).
#   3. an optional pin service (compose profile "pin") keeps an always-on copy of the site and its ledger on this machine, with the image
#      of deploy/pin/Dockerfile. It is not started unless you ask for the profile.
#   4. the project has its own name, so it does not collide with deploy/tracker on a machine that runs both.
# Read README.md in this directory first. In short, from this directory on the server:
#   echo 'LW_SITE=203-0-113-7.nip.io' > .env && docker compose up -d --build
# but `npx felinar ship` does the whole sequence from your own computer, including the staging certificate first.
#
# Only Caddy is reachable from outside (ports 80 and 443); the tracker listens on the internal network.
# Docker Compose 2.17 or newer (--wait-timeout).

name: felinar-one-box

services:
  tracker:
    build:
      # The repository root: the image needs package.json, the lockfile, src/ and tools/.
      context: ../..
      # LW_NODE_IMAGE in .env pins the base image by digest (node:24-bookworm-slim@sha256:<digest>; README, "Upgrades").
      args:
        NODE_IMAGE: ${LW_NODE_IMAGE:-node:24-bookworm-slim}
      dockerfile_inline: |
        ARG NODE_IMAGE=node:24-bookworm-slim
        FROM $${NODE_IMAGE}
        WORKDIR /opt/felinar
        COPY package.json package-lock.json .npmrc ./
        # The runtime dependencies from the lockfile; .npmrc turns install scripts off.
        RUN npm ci --ignore-scripts --omit=dev --no-audit --no-fund && npm cache clean --force
        COPY src ./src
        COPY tools ./tools
        ENV NODE_ENV=production
        USER node
        EXPOSE 8000
        ENTRYPOINT ["node", "tools/tracker.mjs"]
    image: felinar-tracker:local
    # --host 0.0.0.0 inside the container only: the port is not published, so only Caddy reaches it.
    # The allow file is re-read when it changes (deploy/tracker/README.md, "The allow list").
    command: ["--host", "0.0.0.0", "--port", "8000", "--allow", "/etc/magnet-tracker/allow.txt"]
    volumes:
      # The directory, not the file: an update that writes a new file and renames it over the old one
      # (atomic) is seen inside the container; a bind-mounted single file would keep the old copy.
      - ./allow:/etc/magnet-tracker:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # About 25 KiB per open WebSocket plus about 70 MB (docs/research/PRODUCTION-DIGEST.md, 7.1): 1 GiB is
    # room for roughly 35,000 sockets. Small sites see 10 to 1,400.
    mem_limit: 1g
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [internal]

  caddy:
    image: caddy:2.11
    depends_on:
      tracker:
        condition: service_healthy
    environment:
      LW_SITE: ${LW_SITE:?set LW_SITE, for example 203-0-113-7.nip.io}
      # The default is written out here: an empty value would break the Caddyfile.
      LW_ACME_CA: ${LW_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      # Certificates and the ACME account. Keep this volume: losing it requests the certificate again, and Let's Encrypt allows 5 duplicate
      # certificates a week (S2 F5).
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [internal]

  # Start it with `docker compose --profile pin up -d` after the site works. deploy/pin/README.md describes the settings; the key is made once in
  # the mw-pin volume (README.md in this directory, "The pin profile") and is never part of the image. The heartbeat file lands in ./site/ws/ and
  # Caddy serves it from there. The pin runs as the image's node user (uid 1000), so ./site/ws must be writable by that user.
  pin:
    profiles: ["pin"]
    build:
      context: ../..
      dockerfile: deploy/pin/Dockerfile
      args:
        NODE_IMAGE: ${LW_NODE_IMAGE:-node:24-bookworm-slim}
    image: felinar-pin:local
    depends_on:
      - caddy
    environment:
      - PIN_URL=https://${LW_SITE:-localhost}/
      - PIN_KEY=/var/lib/mw-pin/pin.jwk
      - PIN_STATUS=/srv/site/ws/pin-status.json
      # Set in .env when wanted (nothing is passed on when it is not set): PIN_MONTH_CAP, PIN_AUTO_ACCEPT.
      - PIN_MONTH_CAP
      - PIN_AUTO_ACCEPT
    volumes:
      - mw-pin:/var/lib/mw-pin
      - ./site/ws:/srv/site/ws
    # The container is the boundary of the pin's browser (deploy/pin/Dockerfile, "The Chromium sandbox"): no capabilities, no
    # privilege gain (code review v0.3, round 2).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:
  mw-pin:

networks:
  internal:
